# ====================================
# Nginx config para ShopyMarket Frontend
# ====================================
# - Sirve archivos estáticos de React/Vite
# - Redirige rutas SPA a index.html (para React Router)
# - Proxy reverso /api/ → backend:3000 (evita CORS)
# - Proxy reverso /uploads/ → backend:3000 (imágenes)
# - Compresión gzip habilitada

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compresión Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---- Proxy reverso: API requests → backend ----
    # El frontend hace fetch("/api/...") y Nginx lo redirige al contenedor backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Tamaño máximo de uploads (imágenes de productos, etc.)
        client_max_body_size 10M;
    }

    # ---- Proxy reverso: Uploads (imágenes) → backend ----
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SEO: robots.txt y sitemap.xml → backend ----
    location = /robots.txt {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # ---- Cache de archivos estáticos ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA Fallback: React Router ----
    # Cualquier ruta que no sea archivo estático → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
